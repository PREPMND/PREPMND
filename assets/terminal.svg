<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="Toon OS terminal: whoami, ls projects, a Mini Redis SET/INCR/GET demo and @preplabs/validator checks">
  <style>
    .m{font-family:'Courier New',monospace;font-size:17px;font-weight:700}
    .in{fill:#7dffb0}.out{fill:#e9e6ff}.ok{fill:#9be15d}.err{fill:#ff8fb8}.dim{fill:#9a94c8}
    .l{opacity:0;animation:show 14s infinite}
    @keyframes show{0%{opacity:0}2%{opacity:1}92%{opacity:1}96%{opacity:0}100%{opacity:0}}
    .blink{animation:b 4s steps(1) infinite;transform-box:fill-box;transform-origin:center}
    @keyframes b{96%{transform:scaleY(.1)}}
    .cur{animation:c 1s steps(2) infinite}
    @keyframes c{50%{opacity:0}}
  </style>
  <rect x="4" y="4" width="872" height="392" rx="18" fill="#1b1b2a" stroke="#111" stroke-width="5"/>
  <path d="M4 22 Q4 4 22 4 H858 Q876 4 876 22 V48 H4Z" fill="#b69cff" stroke="#111" stroke-width="5"/>
  <circle cx="30" cy="27" r="7" fill="#ff6fb5" stroke="#111" stroke-width="2.5"/><circle cx="52" cy="27" r="7" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="74" cy="27" r="7" fill="#9be15d" stroke="#111" stroke-width="2.5"/>
  <text x="440" y="33" text-anchor="middle" font-family="Trebuchet MS,Verdana,sans-serif" font-weight="800" font-size="17" fill="#111">ToonOS — terminal</text>
  <g transform="translate(840 27) scale(.8)" class="blink"><ellipse cx="-8" rx="5" ry="7" fill="#fff" stroke="#111" stroke-width="2.5"/><ellipse cx="8" rx="5" ry="7" fill="#fff" stroke="#111" stroke-width="2.5"/><circle cx="-8" cy="1" r="2.6"/><circle cx="8" cy="1" r="2.6"/></g>
  <g class="m">
    <text x="28" y="86" class="l in" style="animation-delay:.2s">❯ whoami</text>
    <text x="28" y="112" class="l out" style="animation-delay:.9s">srijan — backend · realtime systems · developer tools · systems in Go</text>
    <text x="28" y="148" class="l in" style="animation-delay:1.8s">❯ ls projects</text>
    <text x="28" y="174" class="l out" style="animation-delay:2.4s">prep        in-progress  NestJS services · orgs · AI classification</text>
    <text x="28" y="198" class="l out" style="animation-delay:2.7s">preytweet   ongoing      auth · Redis · Socket.IO realtime</text>
    <text x="28" y="222" class="l out" style="animation-delay:3.0s">blogmate    shipped      Next.js · BullMQ background jobs</text>
    <text x="28" y="246" class="l out" style="animation-delay:3.3s">validator   on npm       @preplabs/validator · 150+ downloads</text>
    <text x="28" y="282" class="l in" style="animation-delay:4.3s">❯ SET coffee 1  →  INCR coffee</text>
    <text x="28" y="306" class="l ok" style="animation-delay:5.0s">OK  ·  (integer) 2        # mini-redis in Go — in progress</text>
    <text x="28" y="342" class="l in" style="animation-delay:6.0s">❯ validate psw abc</text>
    <text x="28" y="366" class="l err" style="animation-delay:6.7s">✕ length should be greater than 7 and less than 20</text>
    <rect x="28" y="374" width="11" height="4" class="cur" fill="#ffd23f"/>
  </g>
</svg>
