  <text x="30" y="160" class="mono role r3">ships developer tools</text>
  <text x="30" y="194" class="mono dim">MAIT Delhi · intern @ Lili Infotech</text>
  <rect x="380" y="188" width="110" height="3" rx="1.5" fill="url(#g)"/>
