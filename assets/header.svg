<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" width="860" height="210" role="img" aria-label="Srijan Shukla — backend, systems, developer tools">
  <style>
    .mono{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'Courier New',monospace}
    .name{font-size:54px;font-weight:800;fill:#f5f1e8}
    .dim{font-size:15px;fill:#8b8696}
    .role{font-size:22px;font-weight:700;opacity:0}
    .r1{fill:#7dffb0;animation:cyc 9s infinite}
    .r2{fill:#ffd23f;animation:cyc 9s 3s infinite}
    .r3{fill:#ff8fb8;animation:cyc 9s 6s infinite}
    @keyframes cyc{0%{opacity:0;transform:translateY(8px)}4%,30%{opacity:1;transform:none}34%,100%{opacity:0;transform:translateY(-8px)}}
    .cur{animation:blink 1s steps(2) infinite}
    @keyframes blink{50%{opacity:0}}
    .eyes{animation:eyes 4s steps(1) infinite;transform-box:fill-box;transform-origin:center}
    @keyframes eyes{94%{transform:scaleY(.12)}}
    .look{animation:look 6s ease-in-out infinite}
    @keyframes look{0%,40%{transform:translate(0,0)}50%,70%{transform:translate(2.5px,0)}80%,100%{transform:translate(-2px,1px)}}
  </style>
  <defs>
    <clipPath id="c"><rect x="40" y="40" width="0" height="80"><animate attributeName="width" from="0" to="430" begin="0.3s" dur="2s" fill="freeze" calcMode="discrete" values="0;33;66;99;132;165;198;231;264;297;330;363;396;430"/></rect></clipPath>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7dffb0"/><stop offset=".5" stop-color="#ffd23f"/><stop offset="1" stop-color="#ff8fb8"/></linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="857" height="207" rx="18" fill="#0e0d14" stroke="#2a2833" stroke-width="3"/>
  <rect x="40" y="186" width="120" height="3" rx="1.5" fill="url(#g)"/>
  <text x="40" y="44" class="mono dim">~/srijan $ whoami</text>
  <g clip-path="url(#c)"><text x="40" y="104" class="mono name">Srijan Shukla</text></g>
  <rect x="44" y="62" width="4" height="50" fill="#7dffb0" class="cur"><animate attributeName="x" begin="0.3s" dur="2s" fill="freeze" calcMode="discrete" values="44;77;110;143;176;209;242;275;308;341;374;407;424;452"/></rect>
  <text x="40" y="150" class="mono role r1">builds backend services →</text>
  <text x="40" y="150" class="mono role r2">explores systems in Go →</text>
  <text x="40" y="150" class="mono role r3">ships developer tools →</text>
  <g transform="translate(772 92)">
    <circle r="46" fill="#ffd9b0" stroke="#111" stroke-width="4"/>
    <g class="eyes">
      <ellipse cx="-14" cy="-6" rx="10" ry="14" fill="#fff" stroke="#111" stroke-width="3.5"/>
      <ellipse cx="14" cy="-6" rx="10" ry="14" fill="#fff" stroke="#111" stroke-width="3.5"/>
      <g class="look"><circle cx="-12" cy="-3" r="5" fill="#111"/><circle cx="16" cy="-3" r="5" fill="#111"/></g>
    </g>
    <path d="M-12 20 Q0 30 12 20" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="772" y="172" text-anchor="middle" class="mono dim">toon os</text>
</svg>
